name: ai-prime-capital

x-qdrant-image: &qdrant-image "qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION: "${QDRANT_COLLECTION:-ai_prime_capital_documents}"
      QDRANT_DISTANCE: "${QDRANT_DISTANCE:-cosine}"
      OPENAI_EMBEDDING_MODEL: "${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}"
      EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS:-1536}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    expose:
      - "8000"
    networks:
      - public
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6

  qdrant:
    image: *qdrant-image
    restart: unless-stopped
    expose:
      - "6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-ec",
          "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; IFS= read -r status <&3; case \"$$status\" in \"HTTP/1.1 200\"*|\"HTTP/1.0 200\"*) exit 0;; *) exit 1;; esac",
        ]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12

  qdrant-test:
    image: *qdrant-image
    profiles: ["test"]
    expose:
      - "6333"
    ports:
      - "${QDRANT_TEST_PORT:-6333}:6333"
    volumes:
      - qdrant_test_data:/qdrant/storage
    networks:
      - test
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-ec",
          "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; IFS= read -r status <&3; case \"$$status\" in \"HTTP/1.1 200\"*|\"HTTP/1.0 200\"*) exit 0;; *) exit 1;; esac",
        ]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12

volumes:
  qdrant_data:
    name: ai_prime_capital_qdrant_data
  qdrant_test_data:
    name: ai_prime_capital_qdrant_test_data

networks:
  public:
    name: ai-prime-capital_public
  internal:
    internal: true
  test:
    name: ai-prime-capital_test
