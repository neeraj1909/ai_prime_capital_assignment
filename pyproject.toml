[project]
name = "ai-prime-capital"
version = "0.1.0"
description = "Document-grounded RAG API for the AI Developer Technical Assessment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio",
    "fastapi",
    "openai",
    "pydantic-settings",
    "pypdf",
    "python-docx",
    "python-multipart",
    "qdrant-client",
    "tiktoken",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_prime_capital"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: isolated deterministic tests",
    "api: in-process HTTP contract tests",
    "integration: tests that use a real vector database",
    "evaluation: retrieval and grounding quality checks",
    "live_provider: tests that spend credentials against an external provider",
]

[tool.coverage.run]
branch = true
source = ["src/ai_prime_capital"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
